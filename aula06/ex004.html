<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalhando com Strings</title>
</head>
<body>
    <script>
        var nome = window.prompt ('Qual seu nome?')
        nome = nome.replace(' ','')
        document.write(`Seu nome tem ${nome.length} letras`)
    </script>
</body>
</html>
